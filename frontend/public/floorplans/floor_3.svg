<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <style>
    .room { fill: #EFF6FF; stroke: #93C5FD; stroke-width: 2; }
    .lab { fill: #F5F3FF; stroke: #A78BFA; stroke-width: 2; }
    .corridor { fill: #F0FDF4; stroke: #86EFAC; stroke-width: 1.5; }
    .stair { fill: #FEF3C7; stroke: #FCD34D; stroke-width: 2; }
    .server { fill: #FEF2F2; stroke: #FCA5A5; stroke-width: 2; }
    .label { font-family: sans-serif; font-size: 14px; fill: #1E40AF; text-anchor: middle; dominant-baseline: middle; font-weight: 600; }
    .sublabel { font-family: sans-serif; font-size: 11px; fill: #6B7280; text-anchor: middle; dominant-baseline: middle; }
    .floor-label { font-family: sans-serif; font-size: 20px; fill: #1D4ED8; font-weight: bold; }
    .outer-wall { fill: none; stroke: #1E3A5F; stroke-width: 6; }
  </style>
  <rect width="1200" height="900" fill="#F8FAFC"/>
  <text x="30" y="40" class="floor-label">CE Building — Third Floor (3)</text>
  <rect x="80" y="80" width="1040" height="760" class="outer-wall" rx="4"/>
  <rect x="80" y="410" width="1040" height="80" class="corridor"/>
  <text x="600" y="450" class="label">Third Floor Corridor</text>
  <!-- Research Lab -->
  <rect x="80" y="80" width="480" height="330" class="lab"/>
  <text x="320" y="210" class="label" style="fill:#5B21B6;">CE Research Lab</text>
  <text x="320" y="240" class="sublabel">Postgraduate Research · Room R-01</text>
  <!-- Server Room -->
  <rect x="560" y="80" width="300" height="330" class="server"/>
  <text x="710" y="210" class="label" style="fill:#991B1B;">Server Room</text>
  <text x="710" y="240" class="sublabel">🔒 Restricted Access</text>
  <!-- CE-301 Classroom -->
  <rect x="860" y="80" width="260" height="330" class="room"/>
  <text x="990" y="210" class="label">CE-301</text>
  <text x="990" y="240" class="label">Classroom</text>
  <text x="990" y="265" class="sublabel">60 students · Room 301</text>
  <!-- Bottom row -->
  <rect x="80" y="490" width="300" height="350" class="lab"/>
  <text x="230" y="640" class="label">PG Lab</text>
  <text x="230" y="665" class="sublabel">Postgraduate Projects</text>
  <!-- Washroom -->
  <rect x="380" y="490" width="160" height="350" class="room"/>
  <text x="460" y="650" class="label">Washroom</text>
  <text x="460" y="675" class="sublabel">🚻</text>
  <!-- Staircase -->
  <rect x="540" y="490" width="200" height="350" class="stair"/>
  <text x="640" y="640" class="label">Staircase</text>
  <text x="640" y="665" class="label">↓ Floor 2</text>
  <text x="640" y="690" class="sublabel">🪜 (Top Floor)</text>
  <!-- Open Area / Terrace Access -->
  <rect x="740" y="490" width="380" height="350" class="room"/>
  <text x="930" y="640" class="label">Open Area /</text>
  <text x="930" y="665" class="label">Reading Lounge</text>
</svg>
